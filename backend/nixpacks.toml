providers = ["php"]

[variables]
    PHP_VERSION = "8.2"

[phases.install]
    cmds = ["composer install --no-dev --optimize-autoloader"]

[start]
    cmd = "php artisan config:clear; php artisan migrate:fresh --force; php artisan db:seed --force && echo 'SEEDER OK' || echo 'SEEDER FAILED'; php artisan serve --host=0.0.0.0 --port=$PORT"
